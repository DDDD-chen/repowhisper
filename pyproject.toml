[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repowhisper"
version = "0.1.0"
description = "Generate compact AI-ready briefs for any code repository."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Tianqin Chen" }
]
keywords = [
  "ai",
  "agents",
  "codex",
  "claude",
  "cursor",
  "repository",
  "context",
  "cli"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DDDD-chen/repowhisper"
Repository = "https://github.com/DDDD-chen/repowhisper"
Issues = "https://github.com/DDDD-chen/repowhisper/issues"

[project.scripts]
repowhisper = "repowhisper.cli:main"

[tool.setuptools]
packages = ["repowhisper"]
